name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-cost-agent/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff mypy
      - name: Ruff
        run: ruff check app tests
      - name: MyPy strict
        run: mypy app --strict
      - name: Tests
        run: pytest -q
