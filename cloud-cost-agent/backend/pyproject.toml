[project]
name = "cloud-cost-agent-backend"
version = "0.2.0"
description = "Backend services for Cloud Cost Optimization Agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.0",
  "boto3>=1.34.0",
  "celery>=5.4.0",
  "redis>=5.0.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
